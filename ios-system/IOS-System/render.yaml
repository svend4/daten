# Render.com Blueprint для IOS System
# Документация: https://render.com/docs/blueprint-spec

services:
  # Backend API Service (FastAPI)
  - type: web
    name: ios-system-backend
    env: docker
    dockerfilePath: ./Dockerfile.production
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "8000"
      - key: WORKERS
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: ios-system-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ios-system-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ios-system-frontend.onrender.com
      - key: LOG_LEVEL
        value: INFO
    buildCommand: echo "Docker build"
    startCommand: uvicorn main_production:app --host 0.0.0.0 --port $PORT --workers $WORKERS

  # Frontend Service (React + Nginx)
  - type: web
    name: ios-system-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://ios-system-backend.onrender.com
    buildCommand: echo "Docker build"

  # Redis Cache
  - type: redis
    name: ios-system-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # PostgreSQL Database
  - name: ios-system-db
    databaseName: ios_db
    user: ios_user
    plan: starter
    region: frankfurt
    postgresMajorVersion: 15
