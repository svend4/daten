# pytest configuration для IOS System
[pytest]

# Директории для поиска тестов
testpaths = tests

# Паттерны для test файлов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркеры для категоризации тестов
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance and load tests
    slow: Tests that take more than 1 second
    asyncio: Async tests
    security: Security-related tests
    
# Опции по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=ios_system
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=90
    
# Async опции
asyncio_mode = auto

# Игнорировать warnings от сторонних библиотек
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    
# Минимальное покрытие
[coverage:run]
source = ios_system
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
