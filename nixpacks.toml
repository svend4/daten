# Nixpacks configuration for Railway
# Указываем как собирать приложение

[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = [
  "pip install -r ios-system/requirements.txt"
]

[phases.build]
cmds = [
  "echo 'Build complete'"
]

[start]
cmd = "cd ios-system && uvicorn ios_bootstrap.main:app --host 0.0.0.0 --port $PORT"
