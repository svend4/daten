# Railway configuration - Updated for Frontend + Backend
# This file takes priority over Dockerfile CMD

[build]
builder = "DOCKERFILE"
dockerfilePath = "ios-system/Dockerfile"

[deploy]
startCommand = "cd /app && uvicorn ios_bootstrap.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
