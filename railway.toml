# Railway configuration - Full-stack IOS System with Frontend + Backend
# This file takes priority over Dockerfile CMD

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.fullstack"

[deploy]
startCommand = "python /app/start_fullstack.py"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
