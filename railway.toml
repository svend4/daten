# Railway.app deployment configuration
# Railway - бесплатный хостинг для Python приложений

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd ios-system && uvicorn ios_bootstrap.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
ENVIRONMENT = "production"
PYTHONUNBUFFERED = "1"
